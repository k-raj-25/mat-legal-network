services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mat}
      POSTGRES_DB: ${POSTGRES_DB:-mat_legal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mat} -d ${POSTGRES_DB:-mat_legal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mat:mat@db:5432/mat_legal}
    volumes:
      - lawyer_uploads:/app/app/static/uploads/lawyers
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask --app wsgi:app db upgrade &&
             gunicorn --bind 0.0.0.0:5000 --workers 2 wsgi:app"

volumes:
  postgres_data:
  lawyer_uploads:
